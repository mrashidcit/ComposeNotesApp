name: Deploy to Play Store Internal Testing

on:
  push:
    branches:
      - internal-testing

jobs:
  deploy-internal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/TechInnovatives.jks

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF2
          storeFile=$GITHUB_WORKSPACE/app/keystore/TechInnovatives.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2

      - name: Decode Play Store service account key
        env:
          PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}
        run: |
          echo "$PLAY_STORE_JSON_KEY_BASE64" | base64 --decode > fastlane/play-store-key.json

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Deploy to Internal Testing track
        env:
          PLAY_STORE_JSON_KEY_PATH: ${{ github.workspace }}/fastlane/play-store-key.json
        run: bundle exec fastlane android internal
